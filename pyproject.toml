[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masterypath"
version = "0.1.0"
description = "MasteryPath core (M1: domain model, SQLite+CAS storage, policy, mode gating)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.24"]
api = ["fastapi>=0.110", "uvicorn>=0.24"]
# Vector retrieval for knowledge bases. The BM25 retriever is skipped on
# Python 3.14 (PyStemmer has no 3.14 wheels), so retrieval runs vector-only.
rag = [
    "llama-index-core>=0.14.12,<0.15",
    "llama-index-vector-stores-faiss>=0.4.0,<1.0.0",
    "faiss-cpu>=1.12.0,<2.0.0; python_version >= '3.14'",
    "faiss-cpu>=1.8.0,<2.0.0; python_version < '3.14'",
    "numpy>=1.24.0,<3.0.0",
    "llama-index-retrievers-bm25>=0.7.1,<0.8.0; python_version < '3.14'",
]

[tool.setuptools.packages.find]
include = ["masterypath*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
