[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masterypath"
version = "0.1.0"
description = "MasteryPath core (M1: domain model, SQLite+CAS storage, policy, mode gating)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.24"]
api = ["fastapi>=0.110", "uvicorn>=0.24"]

[tool.setuptools.packages.find]
include = ["masterypath*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
